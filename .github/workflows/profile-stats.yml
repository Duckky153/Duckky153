name: profile-stats

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build stats cards (public data only)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/build_stats.py

      - name: Commit if the cards changed
        run: |
          if [ -n "$(git status --porcelain assets)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets
            git commit -m "Refresh profile stats"
            git push
          else
            echo "No change."
          fi
